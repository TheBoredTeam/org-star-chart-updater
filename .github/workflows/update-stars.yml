name: Update organization star histories

on:
  schedule:
    - cron: '11 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    env:
      STAR_HISTORY_OWNER: TheBoredTeam
      STAR_HISTORY_REPOSITORIES: |
        boring.notch
    concurrency:
      group: star-history-updater
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ env.STAR_HISTORY_OWNER }}
          repositories: ${{ env.STAR_HISTORY_REPOSITORIES }}
          permission-contents: write
          permission-metadata: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Update star histories
        run: node scripts/update-star-history.mjs
        env:
          STAR_HISTORY_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          STAR_HISTORY_OWNER: ${{ env.STAR_HISTORY_OWNER }}
          STAR_HISTORY_REPOSITORIES: ${{ env.STAR_HISTORY_REPOSITORIES }}
      - name: Commit star histories
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects
          git diff --cached --quiet || git commit -m 'chore: update OWNER/PROJECT star history'
          git push
