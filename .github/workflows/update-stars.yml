name: Update org star chart

on:
  schedule:
    - cron: '11 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    concurrency:
      group: gh-stars-storage
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: boring.notch
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: nicoloboschi/gh-stars@c659f0480850de4072c66927d0a6c86769f416c5
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          repository: TheBoredTeam/boring.notch
          history-path: projects/boring.notch/data.json
          svg-path: projects/boring.notch/chart.svg
          line-color: '#14b8a6'
      - name: Commit chart
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/boring.notch
          git diff --cached --quiet || git commit -m 'chore: update OWNER/PROJECT star history'
          git push
